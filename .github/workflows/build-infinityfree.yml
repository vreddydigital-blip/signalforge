name: Build for InfinityFree
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:infinityfree
      - uses: actions/upload-artifact@v4
        with:
          name: signalforge-infinityfree
          path: dist/infinityfree
